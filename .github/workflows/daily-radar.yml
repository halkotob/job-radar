name: Daily job radar

on:
  schedule:
    - cron: "47 10 * * *"   # backup run: GitHub sometimes starts scheduled runs late or skips them
    - cron: "17 12 * * *"   # 12:17 UTC = 7:17am Detroit (EST); 8:17am during daylight time
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write   # commit seen.json and the digest back to the repo
  issues: write     # open an issue when there are new matches (GitHub emails you)

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull feeds
        id: radar
        run: python3 job_radar.py --descriptions

      - name: Save state and digest
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add seen.json out/
          git diff --cached --quiet || git commit -m "radar: ${{ steps.radar.outputs.new_count }} new matches"
          git push

      - name: Open an issue with today's matches
        if: steps.radar.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.radar.outputs.out_file }}
        run: |
          # GitHub caps issue bodies at 65,536 characters; link to big digests instead
          if [ "$(wc -c < "$OUT")" -gt 60000 ]; then
            { echo "Too many matches for one issue. Full digest: ${{ github.server_url }}/${{ github.repository }}/blob/main/$OUT"; echo; grep '^## ' "$OUT" | head -c 55000; } > body.md
          else
            cp "$OUT" body.md
          fi
          gh issue create \
            --title "${{ steps.radar.outputs.new_count }} new jobs - $(date +%Y-%m-%d)" \
            --body-file body.md
