name: Vendor skills

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy skills from open-career-skills at the pinned commit
        run: python3 scripts/vendor_skills.py
      - name: Commit
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add .claude/skills story-bank/README.md THIRD_PARTY_LICENSES.md
          git diff --cached --quiet || git commit -m "Vendor career skills from open-career-skills (MIT)"
          git push
